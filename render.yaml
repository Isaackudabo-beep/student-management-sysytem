# Purpose: Render Blueprint for the SMS API (monorepo → api folder).
services:
  - type: web
    name: sms-api
    runtime: node
    plan: free
    rootDir: api
    # --include=dev is required: Render sets NODE_ENV=production during build,
    # which otherwise skips packages needed for `tsc` / Prisma generate.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start:render
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        sync: false
